<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call flow</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6fde; --accent-soft: #e8f0fd; --target: #b4235a; --target-soft: #fbe9f0;
    --entry: #0f7b55; --entry-soft: #e4f5ee; --warn: #9a6200; --warn-soft: #fff4dc;
    --code-bg: #f1f3f6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1c1f26; --text: #e6e8ec; --muted: #9aa3b2; --line: #2c313b;
      --accent: #6c9cf0; --accent-soft: #1f2b44; --target: #f07aa6; --target-soft: #3a1f2b;
      --entry: #4fc596; --entry-soft: #173226; --warn: #f0b54a; --warn-soft: #3a2e17;
      --code-bg: #242833; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  code, .mono { font-family: "Cascadia Code", Consolas, "SF Mono", monospace; font-size: 12.5px; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px 64px; }

  header .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  header h1 { margin: 4px 0 6px; font-size: 24px; font-weight: 650; word-break: break-word; }
  header h1 .t { color: var(--target); }
  header .where { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 22px 0 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); }
  .stat .n { font-size: 22px; font-weight: 650; }
  .stat .l { color: var(--muted); font-size: 12.5px; }

  .note { border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; font-size: 13px; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .note.info { background: var(--accent-soft); color: var(--text); }

  .toolbar { display: flex; gap: 8px; align-items: center; margin: 18px 0 14px; flex-wrap: wrap; }
  .tabs { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .tabs button { border: 0; background: none; color: var(--muted); padding: 6px 14px; border-radius: 6px; font: inherit; cursor: pointer; }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .toolbar input { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
                   background: var(--card); color: var(--text); font: inherit; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }

  .group { margin: 22px 0 8px; }
  .group-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .group-h .name { font-weight: 650; font-size: 15px; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.entry { background: var(--entry-soft); color: var(--entry); }
  .badge.target { background: var(--target-soft); color: var(--target); }
  .badge.via { background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .group-h .count { color: var(--muted); font-size: 12.5px; }

  details.path { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; box-shadow: var(--shadow); }
  details.path > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; gap: 10px; align-items: center; }
  details.path > summary::-webkit-details-marker { display: none; }
  details.path > summary .chev { color: var(--muted); transition: transform .15s; flex: none; }
  details.path[open] > summary .chev { transform: rotate(90deg); }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-width: 0; }
  .crumb { font-size: 13px; white-space: nowrap; }
  .crumb.first { color: var(--entry); font-weight: 600; }
  .crumb.last { color: var(--target); font-weight: 600; }
  .arrow { color: var(--muted); font-size: 12px; }
  .steps-n { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; padding-left: 10px; }

  ol.flow { list-style: none; margin: 0; padding: 4px 18px 16px 18px; border-top: 1px solid var(--line); }
  ol.flow li { position: relative; padding: 12px 0 0 38px; }
  ol.flow li::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--line); }
  ol.flow li:first-child::before { top: 24px; }
  ol.flow li:last-child::before { bottom: auto; height: 24px; }
  .dot { position: absolute; left: 2px; top: 12px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
         font-size: 11.5px; font-weight: 700; background: var(--card); border: 2px solid var(--accent); color: var(--accent); }
  li.entry .dot { border-color: var(--entry); color: var(--entry); background: var(--entry-soft); }
  li.target .dot { border-color: var(--target); color: var(--target); background: var(--target-soft); }
  .m { font-weight: 600; word-break: break-word; }
  .m .type { color: var(--muted); font-weight: 500; }
  .loc { color: var(--muted); font-size: 12px; }
  .call { margin: 6px 0 2px; display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  .call .lbl { color: var(--muted); font-size: 12px; padding-top: 3px; white-space: nowrap; }
  .call code { background: var(--code-bg); padding: 3px 8px; border-radius: 6px; word-break: break-all; }
  .end { margin: 12px 0 0 38px; font-size: 12.5px; }

  #graph { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; overflow: auto; box-shadow: var(--shadow); }
  #graph svg { max-width: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  .hidden { display: none !important; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Call flow</div>
    <h1>How does the code reach <span class="t" id="targetName"></span>?</h1>
    <div class="where" id="targetWhere"></div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="notes"></div>

  <div class="toolbar">
    <div class="tabs">
      <button class="on" data-tab="paths">Paths</button>
      <button data-tab="graph">Graph</button>
    </div>
    <input id="search" type="search" placeholder="Filter paths by class or method name…">
    <button class="btn" id="expandAll">Expand all</button>
    <button class="btn" id="collapseAll">Collapse all</button>
  </div>

  <section id="pathsView"></section>
  <section id="graphView" class="hidden"><div id="graph"><div class="empty">Loading graph…</div></div></section>

  <footer id="footer"></footer>
</div>

<script>
const DATA = /*__CALLFLOW_DATA__*/null;
const MAX_PATHS = 300;

(function () {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = id => document.getElementById(id);

  if (!DATA) { $("pathsView").innerHTML = '<div class="empty">No data.</div>'; return; }

  const nodes = new Map(DATA.nodes.map(n => [n.id, n]));
  const target = nodes.get(DATA.target);
  const callersOf = new Map();
  for (const e of DATA.edges) {
    if (e.from === e.to) continue;              // direct recursion: not a path
    if (!callersOf.has(e.to)) callersOf.set(e.to, []);
    callersOf.get(e.to).push(e);
  }

  // ---- enumerate every path entry → target (walk callers backwards) ----
  const paths = [];
  let capped = false;
  (function walk(id, nodeStack, edgeStack, onPath) {
    if (paths.length >= MAX_PATHS) { capped = true; return; }
    const all = callersOf.get(id) || [];
    const next = all.filter(e => !onPath.has(e.from));
    if (next.length === 0) {
      const top = nodes.get(id);
      const end = top.cut ? "cut" : (all.length > 0 && !top.entryKind ? "cycle" : "entry");
      paths.push({ nodes: nodeStack.slice().reverse(), edges: edgeStack.slice().reverse(), end });
      return;
    }
    for (const e of next) {
      onPath.add(e.from); nodeStack.push(nodes.get(e.from)); edgeStack.push(e);
      walk(e.from, nodeStack, edgeStack, onPath);
      onPath.delete(e.from); nodeStack.pop(); edgeStack.pop();
      if (capped) return;
    }
  })(target.id, [target], [], new Set([target.id]));

  const realPaths = paths.filter(p => p.nodes.length > 1);

  // ---- group by where the flow starts ----
  const groups = new Map();
  for (const p of realPaths) {
    const start = p.nodes[0];
    if (!groups.has(start.id)) groups.set(start.id, { start, paths: [] });
    groups.get(start.id).paths.push(p);
  }
  const rank = g => g.start.entryKind && !g.start.entryKind.startsWith("No callers") ? 0 : g.start.cut ? 2 : 1;
  const ordered = [...groups.values()].sort((a, b) => rank(a) - rank(b) || a.paths[0].nodes.length - b.paths[0].nodes.length);

  // ---- header ----
  $("targetName").textContent = target.name;
  document.title = "Call flow → " + target.name;
  $("targetWhere").innerHTML = [target.ns && esc(target.ns), target.file && `<span class="mono">${esc(target.file)}:${target.line}</span>`, target.project && "project " + esc(target.project)]
    .filter(Boolean).join(" · ");

  const deepest = realPaths.reduce((m, p) => Math.max(m, p.nodes.length - 1), 0);
  const stat = (n, l) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  $("stats").innerHTML =
    stat(ordered.length, ordered.length === 1 ? "starting point" : "starting points") +
    stat(realPaths.length + (capped ? "+" : ""), realPaths.length === 1 ? "path" : "different paths") +
    stat(DATA.nodes.length - 1, "methods involved") +
    stat(deepest, "calls in the longest path");

  const notes = [];
  if (DATA.truncated) notes.push(`<div class="note warn">The analysis stopped early (limit: ${DATA.maxDepth} levels / ${DATA.maxNodes} methods). Paths marked <b>“more callers not shown”</b> continue further up.</div>`);
  if (capped) notes.push(`<div class="note warn">Only the first ${MAX_PATHS} paths are listed. The Graph tab shows every method.</div>`);
  if (DATA.edges.some(e => e.via)) notes.push(`<div class="note info">Some steps go through an <span class="badge via">interface</span> or base class. At runtime the call lands here only if this implementation is the one that was injected or created.</div>`);
  $("notes").innerHTML = notes.join("");

  // ---- paths view ----
  const typeAndMember = name => {
    const paren = name.indexOf("(");
    const head = paren >= 0 ? name.slice(0, paren) : name;
    const dot = head.lastIndexOf(".");
    return dot < 0 ? { type: "", member: name } : { type: name.slice(0, dot + 1), member: name.slice(dot + 1) };
  };
  const shortName = n => { const t = typeAndMember(n.name); const m = t.member.replace(/\(.*\)$/, "()"); return t.type + m; };
  const entryBadge = n => n.entryKind ? `<span class="badge entry">${esc(n.entryKind)}</span>${n.entryDetail ? ` <code>${esc(n.entryDetail)}</code>` : ""}` : "";

  function renderPath(p, idx) {
    const crumbs = p.nodes.map((n, i) =>
      `<span class="crumb ${i === 0 ? "first" : ""} ${i === p.nodes.length - 1 ? "last" : ""}">${esc(shortName(n))}</span>`
    ).join('<span class="arrow">→</span>');

    const steps = p.nodes.map((n, i) => {
      const t = typeAndMember(n.name);
      const cls = i === 0 ? "entry" : i === p.nodes.length - 1 ? "target" : "";
      const edge = p.edges[i]; // call from this step to the next one
      let call = "";
      if (edge) {
        const sites = edge.sites.length ? edge.sites : [{ line: 0, code: "" }];
        call = sites.slice(0, 3).map(s =>
          `<div class="call"><span class="lbl">${s.line ? "line " + s.line + " calls ↓" : "calls ↓"}</span><code>${esc(s.code)}</code>` +
          (edge.via ? ` <span class="badge via">via ${esc(edge.via)}</span>` : "") +
          (edge.lambda ? ` <span class="badge warn">inside a lambda / callback</span>` : "") + `</div>`
        ).join("") + (sites.length > 3 ? `<div class="loc">…and ${sites.length - 3} more call sites</div>` : "");
      }
      return `<li class="${cls}"><span class="dot">${i + 1}</span>
        <div class="m"><span class="type">${esc(t.type)}</span>${esc(t.member)}
          ${i === 0 ? entryBadge(n) : ""}${i === p.nodes.length - 1 ? ' <span class="badge target">your method</span>' : ""}</div>
        <div class="loc mono">${esc(n.file || "")}${n.line ? ":" + n.line : ""}</div>${call}</li>`;
    }).join("");

    const end = p.end === "cut" ? `<div class="end"><span class="badge warn">more callers not shown</span> the analysis limit was reached above step 1.</div>`
              : p.end === "cycle" ? `<div class="end"><span class="badge warn">recursive loop</span> step 1 is only reached from methods already in this path.</div>` : "";

    const search = p.nodes.map(n => n.name + " " + (n.file || "")).join(" ").toLowerCase();
    return `<details class="path" data-search="${esc(search)}"${idx === 0 ? " open" : ""}>
      <summary><span class="chev">▶</span><div class="crumbs">${crumbs}</div><span class="steps-n">${p.nodes.length - 1} call${p.nodes.length === 2 ? "" : "s"}</span></summary>
      <ol class="flow">${steps}</ol>${end}</details>`;
  }

  let first = true;
  $("pathsView").innerHTML = ordered.length === 0
    ? `<div class="empty">Nothing in this solution calls <b>${esc(target.name)}</b>.<br>${target.entryKind ? `It looks like: <span class="badge entry">${esc(target.entryKind)}</span>` : ""}</div>`
    : ordered.map(g => {
        const html = `<div class="group"><div class="group-h"><span class="name">Starts at ${esc(shortName(g.start))}</span>${entryBadge(g.start)}
          ${g.start.cut ? '<span class="badge warn">limit reached</span>' : ""}
          <span class="count">${g.paths.length} path${g.paths.length === 1 ? "" : "s"}</span></div>
          ${g.paths.map(p => { const h = renderPath(p, first ? 0 : 1); first = false; return h; }).join("")}</div>`;
        return html;
      }).join("");

  // ---- search / expand ----
  $("search").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll("details.path").forEach(d => d.classList.toggle("hidden", q && !d.dataset.search.includes(q)));
    document.querySelectorAll(".group").forEach(g => g.classList.toggle("hidden", !g.querySelector("details.path:not(.hidden)")));
  });
  $("expandAll").onclick = () => document.querySelectorAll("details.path").forEach(d => d.open = true);
  $("collapseAll").onclick = () => document.querySelectorAll("details.path").forEach(d => d.open = false);

  // ---- graph view (Mermaid, loaded on demand) ----
  let graphLoaded = false;
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    const g = b.dataset.tab === "graph";
    $("pathsView").classList.toggle("hidden", g);
    $("graphView").classList.toggle("hidden", !g);
    ["search", "expandAll", "collapseAll"].forEach(id => $(id).classList.toggle("hidden", g));
    if (g && !graphLoaded) { graphLoaded = true; loadGraph(); }
  });

  function mermaidText() {
    const idx = new Map(DATA.nodes.map((n, i) => [n.id, "n" + i]));
    const lbl = s => s.replace(/"/g, "#quot;").replace(/</g, "#lt;").replace(/>/g, "#gt;");
    const lines = ["flowchart LR"];
    DATA.nodes.forEach(n => {
      const t = typeAndMember(n.name);
      lines.push(`  ${idx.get(n.id)}["${lbl(t.type.replace(/\.$/, ""))}<br/><b>${lbl(t.member.replace(/\(.*\)$/, "()"))}</b>"]`);
    });
    DATA.edges.filter(e => e.from !== e.to).forEach(e =>
      lines.push(e.via ? `  ${idx.get(e.from)} -. "${lbl(e.via)}" .-> ${idx.get(e.to)}` : `  ${idx.get(e.from)} --> ${idx.get(e.to)}`));
    lines.push("  classDef entry fill:#e4f5ee,stroke:#0f7b55,color:#0b4d36;");
    lines.push("  classDef target fill:#fbe9f0,stroke:#b4235a,color:#7a1239,stroke-width:2px;");
    lines.push("  classDef cut fill:#fff4dc,stroke:#9a6200,color:#5c3b00,stroke-dasharray:4 3;");
    const entries = DATA.nodes.filter(n => n.entryKind && n.id !== DATA.target).map(n => idx.get(n.id));
    const cuts = DATA.nodes.filter(n => n.cut).map(n => idx.get(n.id));
    if (entries.length) lines.push("  class " + entries.join(",") + " entry;");
    if (cuts.length) lines.push("  class " + cuts.join(",") + " cut;");
    lines.push("  class " + idx.get(DATA.target) + " target;");
    return lines.join("\n");
  }

  function loadGraph() {
    const box = $("graph");
    if (DATA.nodes.length > 250) { box.innerHTML = `<div class="empty">The graph has ${DATA.nodes.length} methods — too large to draw clearly. Use the Paths tab.</div>`; return; }
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js";
    s.onload = async () => {
      try {
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default", securityLevel: "strict", flowchart: { htmlLabels: true, curve: "basis" }, maxTextSize: 200000 });
        const { svg } = await mermaid.render("cfg", mermaidText());
        box.innerHTML = svg;
      } catch (err) { box.innerHTML = `<div class="empty">Could not draw the graph: ${esc(err.message || err)}</div>`; }
    };
    s.onerror = () => { box.innerHTML = '<div class="empty">The graph needs an internet connection (it loads Mermaid from cdn.jsdelivr.net). The Paths tab works offline.</div>'; };
    document.head.appendChild(s);
  }

  $("footer").textContent = `Generated ${DATA.generatedAt}${DATA.solution ? " · " + DATA.solution : ""} · static analysis: calls made through reflection, dynamic, or framework conventions are not visible.`;
})();
</script>
</body>
</html>
